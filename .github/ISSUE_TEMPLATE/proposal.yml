name: Propose a workflow improvement
description: Describe a concrete step in one-person business work.
title: "[Proposal] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: Workflow and current friction
      description: Use a fictional request or job to explain what gets in the way.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome you would like
      description: Describe what would make the change useful and how you would tell.
    validations:
      required: true
